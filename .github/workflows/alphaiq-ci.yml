name: AlphaIQ CI

on:
  pull_request:
  push:
    branches:
      - alphaiq-market-regime

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          from pathlib import Path
          lines = Path('requirements.txt').read_text(encoding='utf-8-sig').splitlines()
          filtered = [line for line in lines if not line.strip().lower().startswith('metatrader5')]
          Path('/tmp/requirements-ci.txt').write_text('\n'.join(filtered) + '\n', encoding='utf-8')
          PY
          python -m pip install -r /tmp/requirements-ci.txt

      - name: Compile AlphaIQ package
        run: python -m compileall -q alphaiq

      - name: Run test suite
        run: python -m pytest -q
